style=\"align-self:center\"><\/strong><\/div><p id=\"message\" role=\"status\" aria-live=\"polite\"><\/p><\/main><script>const P=[\"Greek philosophers theorised Earth in a Spherical shape identifying the North and South Polar regions between 600 BC and 300 BC. These theories led to great intrigue, debate and even deaths at the time. On that same line, there are many scripts and maps from the 15th and 18th centuries which also inspired the belief in a hypothetical continent called Terra Australis in the Southern Hemisphere. However, no explorations had been conducted yet. It was only theory what led physicists and analysts to believe in the need for balance to the already known and inhabited North Pole.\", \"The theory of balancing land inspired many explorers, including, many centuries later, Captain Cook, to risk their lives in the pursuit of surveying and mapping the southern hemisphere. Many reports tell us about a curious Polynesian navigator, Ui-te-Rangiora, who searched the southern seas. He first reported the finding of ice floes and icebergs in the ocean area of what he called Tai-uka-a-pia “sea foaming like arrowroot”. Polynesians discovered and populated the Auckland Islands in the 13th century according to archeological findings conducted later, being these islands the most southernly Polynesians have ever been known to settle.\", \"It was Ferdinand Magellan leading a fleet of 5 vessels who first ventured towards Patagonia lands and connected the two Masses of big Pacific and Atlantic water through the Strait of Magellan, which he called “Peaceful sea”. The expedition managed to land on the Philippine Islands where he lost his life in the battle of Mactan. One of his ships struggled his way back home to Spain via the Indian Ocean earning the prize of being the first round sailing of the globe. Not only Magellan but many lives were lost in these early ventures to draw a picture of our world as we know it today.\", \"It was in the 16th and 17th centuries when early mapping and proven observation of southern seas encouraged many adventurers and sailors onto the quest for both wealth and glory, leading to the mapping of what we refer to today as Latin America. Among these heroes we find Francis Drake, Dirk Gerritsz, Gabriel de Castilla, Jacob le Maire, and William Schouten. Some accounts identify Dirck Gerritsz Pomp as the first European to sight the Antarctica, though others attribute the privilege to Gabriel de Castilla. The eagerness for discovery was growing as the land became less and less of a mystery.\", \"Not only were lands new to men, water proved to be surprising as well. What is now called the Antarctic Convergence or Antarctic Polar Front posed many hardships to sailors. The Antarctic convergence is a natural curve running round Antarctica, varying in latitude with the seasons. This circular frontier divides the cold northern Antarctic waters from the somewhat warmer waters of the subantarctic. This barrier stands in-between two distinctive marine environments and climates, poising, a stumbling block to sailors and explorers. It was first crossed by Anthony de la Roché who first reported landing on South Georgia island.\", \"Every sea heavy storm and battle tested the equipment structures and materials with which our heroes pursued their dreams. Ships were among the most damaged and challenged goods. As every captain, James Cook had the apple of his eye. He earnestly counted on the HMS Resolution, a converted merchant collier, adjusted by the Royal British Navy, on which he made his second and third voyages of exploration in the Pacific. He called her “The ship of my choice, and “The fittest for service of any I have seen”.\", \"The 19th century produced a series of first achievements on Antarctica. Mercator Cooper was the first to beat all odds and properly document his setting foot on the icy mainland of Antarctica, and the HMS Challenger ship was the first steamship to cross the Antarctic Circle. The first to ski the Antarctica’s slopes was Norwegian Carl Anton Larsen aboard the Jason. Only a few had attempted it before, but it was Adrienne de Gerlache to first winter in Antarctica. It’s not easy to imagine how these men felt knowing they would be making way for future scientists, researchers, merchants, and settlers into an unknown and certainly, uninviting land.\"],H=[\"A natural water barrier\", \"Landing on your dreams\", \"Not every vessel could make it\", \"Everything was dreams and calculations\", \"Surge of curiosity and discovery\", \"First sightings\", \"Getting the world connected\", \"Giving up all too soon\"],K=[3, 5, 6, 4, 0, 2, 1],N=[[\"The paragraph centres on theories and a hypothetical continent before exploration began.\", \"Đoạn nói về giả thuyết và lục địa được hình dung trước khi có thám hiểm.\"], [\"Early reports of ice and the discovery of islands are the main focus.\", \"Trọng tâm là những ghi nhận đầu tiên về băng và việc phát hiện các đảo.\"], [\"The voyage connects oceans and leads to a journey around the globe.\", \"Hành trình nối các đại dương và dẫn đến chuyến đi vòng quanh thế giới.\"], [\"Growing curiosity encourages more explorers and new discoveries.\", \"Sự tò mò ngày càng lớn thúc đẩy các nhà thám hiểm và những phát hiện mới.\"], [\"A circular frontier divides two marine environments and creates an obstacle.\", \"Ranh giới vòng quanh chia tách hai môi trường biển và tạo trở ngại.\"], [\"Storms test ships; Cook relies on a vessel fit for demanding voyages.\", \"Bão thử thách tàu thuyền; Cook dựa vào con tàu phù hợp với hành trình khắc nghiệt.\"], [\"The paragraph brings together first achievements: landing, crossing, skiing and wintering.\", \"Đoạn tập hợp các thành tựu đầu tiên: đặt chân lên lục địa, vượt vòng Nam Cực, trượt tuyết và trú đông.\"]];const KEY='pop-long-reading-v1';let s={active:0,answers:Array(7).fill(null),checked:false,vi:false,skim:false};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger( k').innerHTML=s.checked?'<strong>'+(s.answers[s.active]===K[s.active]?'✓ Correct':'Correct heading: '+H[K[s.active]])+'<\/strong><p>'+N[s.active][0]+'<span class=\"vi\">'+N[s.active][1]+'<\/span><\/p>':'';el('score').textContent=s.checked?grade(s.answers)+' / 7 correct':s.answers.filter(v=>v!==null).length+' / 7 answered';el('message').textContent=s.checked?(grade(s.answers)===7?'All seven headings are correct.':'Review each paragraph and its heading.') :'';drawText()}\nel('scan').oninput=drawText;el('clear').onclick=()=>{el('scan').value='';drawText()};el('skim').onclick=()=>{s.skim=!s.skim;save();render()};el('lang').onclick=()=>{s.vi=!s.vi;save();render()};el('check').onclick=()=>{if(s.answers.some(v=>v===null)){el('message').textContent='Choose a heading for all 7 paragraphs first.';return}s.checked=true;save();render()};el('reset').onclick=()=>{s.answers=Array(7).fill(null);s.checked=false;s.active=0;el('scan').value='';save();render()};render();\n<\/script><script>new ResizeObserver(()=>parent.postMessage({popHeight:document.documentElement.scrollHeight},'*')).observe(document.body);<\/script><\/body><\/html>", "match": "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>POP DOSSIER · Reading Part 3<\/title><style>\n:root{--ink:#202225;--paper:#fffdf5;--lime:#c8ff46;--pink:#ff4fa3;--cyan:#65e7ff}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--ink);font-family:Arial,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;border:2px solid var(--ink);border-radius:9px;background:var(--paper);padding:11px 15px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}button:hover{background:var(--cyan)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a60052;outline-offset:4px}button:disabled{opacity:.45;cursor:default}header{color:var(--paper);max-width:1150px;margin:auto;padding:20px 26px;display:flex;align-it v{height:100%;background:var(--pink);transition:width .2s}.muted{font-size:12px;color:#595950}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.primary{background:var(--lime)}#message{font-size:13px;line-height:1.6;margin:14px 0 0}.steps{padding-left:20px;margin:0;font-size:14px;line-height:1.6}.steps li{padding:0 0 12px 4px}.steps strong{display:block}.vi{display:none;color:#656052;font-size:.9em;margin-top:5px}body.bilingual .vi{display:block}details{margin-top:25px;border-top:2px solid;padding-top:16px}summary{cursor:pointer;font-weight:700;font-size:14px}.explanation{border:1px solid #bdb9ad;border-radius:9px;padding:14px;margin-top:12px;background:#fffdf5;font-size:14px;line-height:1.6}.explanation strong{display:block}.source{font-size:11px;line-height:1.7;margin:27px 0 0;color:#666158}#review:empty{display:none}.reviewtitle{margin:26px 0 10px;font-size:18px}.badge{background:var(--pink);color:#151515;display:inline-block;border:1.5px solid;padding:5px 10px;border-radius:5px;transform:rotate(-3deg);font-size:11px;font-weight:900} @media(max-width:760px){header{padding:16px}.layout{grid-template-columns:1fr}main{margin:0 10px 25px;padding:20px 16px}.email{padding:20px 17px;font-size:19px}.mailhead{padding:15px}.panel{margin-bottom:0}.layout aside{display:grid;gap:20px}h1{font-size:35px}}@media print{body{background:white}header,.actions,details,aside{display:none}main{border:0;box-shadow:none;margin:0;padding:0}.layout{display:block}.paper{box-shadow:none}.email{background:white}select{appearance:none}.source{color:black}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n.layout{grid-template-columns:minmax(0,1.2fr) minmax(320px,1fr)}.reading{padding:22px}.person{margin:0 0 22px;padding-bottom:20px;border-bottom:1px solid #d5d0c1;scroll-margin-top:20px}.person:last-child{margin-bottom:0;border-bottom:0}.person h3{font:800 13px Arial;letter-spacing:1px;margin:0 0 12px}.person p{font:18px/1.8 Georgia;margin:0}.person h3 b{display:inline-block;background:var(--cyan);border:2px solid;padding:7px 11px;margin-right:10px;border-radius:7px}.skim .edge{background:#e9f4b8}.evidence{background:#c8ff46!important;box-shadow:0 2px 0 #456b14}.qcard{background:var(--paper);border:2px solid;border-radius:12px;padding:17px;margin:0 0 15px;box-shadow:3px 3px 0 #222}.qcard h3{font:700 15px/1.5 Arial;margin:0 0 13px}.choices{display:flex;gap:10px}.choices button{flex:1;padding:10px;box-shadow:2px 2px 0 #222}.choices button.selected{background:var(--pink)}.choices button.correctchoice{background:var(--lime)}.qcard .feedback{font-size:13px;line-height:1.6;margin-top:12px}.feedback blockquote{font-family:Georgia;margin:10px 0;padding-left:10px;border-left:3px solid #b4ce63}.feedback button{font-size:11px;padding:7px 9px;box-shadow:none}.minirow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.minirow button{font-size:12px;box-shadow:none;padding:8px 12px}.toolbar{margin:0 0 23px}.toolbar summary{padding-bottom:10px}.toolbar details{margin:0;border:0;padding:0}.toolbar .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;font-size:13px;margin-top:14px}.progresspanel{margin-top:8px}.qcard:focus-within{outline:1px solid #888}#questions{scroll-margin-top:20px}.sticky-actions{position:sticky;bottom:10px;background:var(--paper);padding:13px;border:2px solid;border-radius:10px;box-shadow:3px 3px 0 #222;z-index:2}.sticky-actions .actions{margin:0}.source{clear:both}@media(max-width:760px){.layout{grid-template-columns:1fr}.toolbar .steps{grid-template-columns:1fr 1fr}.reading{padding:18px}.person p{font-size:18px}.layout aside{display:block}.sticky-actions{bottom:5px}.mailhead{flex-wrap:wrap}}@media print{.layout{display:block}.choices,.sticky-actions,.minirow,header{display:none}.qcard,.person{break-inside:avoid}.qcard{box-shadow:none}.layout aside{display:block}}.layout{grid-template-columns:minmax(0,1.35fr) minmax(280px,1fr)}.pnav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.pnav button{box-shadow:none;min-width:40px}.active,.selected{background:var(--pink)!important}.headingbtn{display:block;width:100%;text-align:left;margin:10px 0;font-size:14px;line-height:1.5;box-shadow:2px 2px 0}.headingbtn.good{background:var(--lime)!important}.article{padding:25px;font:20px/1.9 Georgia}.scanbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.scanbar input{padding:10px;min-width:0;flex:1;border:2px solid;border-radius:8px;font:14px Arial}.scanbar button{box-shadow:none;font-size:12px}.edge.on{background:#e9f4b8}mark{background:#65e7ff;color:#111}.feedback{font:14px/1.7 Arial;margin-top:20px}.steps{font-size:13px}.reading-title{font:700 23px/1.3 Georgia;margin:0 0 18px}.source{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.article{font-size:19px;padding:20px}}<\/style><\/head><body><header><div class=\"brand\"><b>POP<\/b> DOSSIER<\/div><button id=\"language\" aria-pressed=\"false\">EN / VI<\/button><\/header><main><div class=\"kicker\">Reading part 3 · Scanning practice<\/div><h1>Option <span style=\"color:#ba245e\">matching<\/span><\/h1><p class=\"intro\">Read the questions. Match each statement to A, B, C or D. You can use each letter more than once.<\/p><section class=\"panel toolbar\"><details><summary>Scan, then confirm<\/summary><ol class=\"steps\"><li><strong>Read all questions.<\/strong>Notice the idea each one asks about.<span class=\"vi\">Đọc tất cả câu hỏi và xác định ý cần tìm.<\/span><\/li><li><strong>Scan each opinion.<\/strong>Look for keywords and related phrases, then read the full paragraph.<span class=\"vi\">Tìm từ khóa và cách diễn đạt tương đương, sau đó đọc cả đoạn.<\/span><\/li><li><strong>Choose a likely person.<\/strong>Match meaning, not just repeated words.<span class=\"vi\">Chọn người phù hợp theo nghĩa, không chỉ dựa vào từ giống nhau.<\/span><\/li><li><strong>Confirm in the full text.<\/strong>Read the relevant paragraph carefully for evidence.<span class=\"vi\">Đọc kỹ toàn đoạn liên quan để xác nhận bằng chứng.<\/span><\/li><\/ol><\/details><\/section><div class=\"layout\"><section class=\"paper\"><div class=\"mailhead\"><div><div class=\"kicker\">Practice test 1<\/div><strong>Working from home<\/strong><\/div><div class=\"minirow\"><button id=\"skim\" aria-pressed=\"false\">Skim<\/button><button id=\"jump\">Questions<\/button><\/div><\/div><div class=\"scanbar\" style=\"padding:15px\"><input id=\"scanMatch\" aria-label=\"Scan text\" placeholder=\"Scan: word or phrase\"><button id=\"clearMatch\">Clear<\/button><\/div><div id=\"reading\" class=\"reading\"><\/div><\/section><aside><div id=\"questions\"><\/div><div class=\"sticky-actions\"><div class=\"minirow\" style=\"justify-content:space-between;margin-bottom:12px\"><strong id=\"score\">0 / 7 answered<\/strong><span id=\"badge\" class=\"badge\">MATCH THE IDEAS<\/span><\/div><div class=\"actions\"><button class=\"primary\" id=\"check\">Check answers<\/button><button id=\"reset\">Try again<\/button><\/div><div id=\"message\" role=\"status\" aria-live=\"polite\"><\/div><\/div><\/aside><\/div><\/main><script>const TEXTS=[[\"I think working from home is the future.\", \"I love not having to commute which is not only good for the environment, but also saves time.\", \"I don’t need to wait for the bus or take the car.\", \"I can spend that extra free time with my family and friends.\", \"This gets me in a better mood to commit to my job and enjoy doing it.\", \"I like having the chance to choose how to spend my free time and with whom.\"], [\"I hate working from home.\", \"I’m all alone with no-one to talk to, I’m interrupted by endless phone calls while I’m having lunch, or dinner, sometimes.\", \"When I need clarification or to get feedback to move on with some task, I don’t necessarily get a good connection or understand what I’m told on online meetings.\", \"It’s hard to have team meetings as everybody talks at the same time and it’s hard to follow what’s being discussed.\", \"It ends up being a 24 hours job because you don’t get things done right from the start and you have to wait for others to get connected.\"], [\"What is hard is to be disciplined.\", \"Working from home means you are actually at home, where there’s TV, a book you’re reading, music, YouTube, and no boss or team watching over your head telling you to keep up.\", \"So, if you’re not disciplined like me, you may not get the work done right and on time.\", \"However, once you finally get started, it’s nice to work from home, where you can create your own environment, organise things as you like, and there’s no talk as to who got the best office and who the worst.\", \"There’s less office gossip going around in general, and that’s good.\"], [\"Being able to decide when to do what is great.\", \"I have my tasks, and I can get organised the way I want to.\", \"There’re no interruptions, no people coming to you with questions or requests all the time, which makes it very hard for me to concentrate and focus on what I’m doing.\", \"You can always get connected on Skype, Teams, Zoom, and others and have meetings without the need to be then constantly interrupted when you need to focus on something.\", \"The connection is sometimes not so good, but all in all, I get more work done now than when I worked in the office.\"]], QUESTIONS=[[\"Who thinks internet connections can make things harder?\", \"B\", 2, \"B links poor connections with difficulty getting clarification and understanding online meetings. D mentions a weak connection too, but still emphasises getting more work done.\", \"B nói kết nối kém gây khó khăn khi cần giải đáp và hiểu nội dung họp. D cũng nhắc kết nối kém nhưng vẫn nhấn mạnh làm được nhiều việc hơn.\"], [\"Who says working from home helps concentration?\", \"D\", 3, \"D values being able to focus without constant interruptions. Read the whole paragraph: the questions and requests are the distractions that make concentration difficult.\", \"D coi trọng việc tập trung mà không bị gián đoạn liên tục. Đọc cả đoạn để hiểu các câu hỏi và yêu cầu từ người khác chính là điều gây mất tập trung.\"], [\"Who values not having their boss around?\", \"C\", 1, \"C mentions having no boss or team watching over them and later describes enjoying their own work environment.\", \"C nhắc đến việc không có sếp hoặc đồng nghiệp giám sát, rồi nói thích tự tạo môi trường làm việc.\"], [\"Who thinks if people aren’t organised working from home it is harder?\", \"C\", 2, \"C says a lack of discipline can prevent people from completing work correctly and on time. “Aren’t organised” paraphrases this lack of discipline.\", \"C nói thiếu kỷ luật có thể khiến công việc không đạt yêu cầu hoặc không đúng hạn. “Aren’t organised” diễn đạt lại ý thiếu tính kỷ luật này.\"], [\"Who enjoys the chance to deal with work freely?\", \"D\", 1, \"D can decide when to do tasks and organise work in their own way. This is freedom over work, rather than leisure time.\", \"D được quyết định thời điểm thực hiện nhiệm vụ và tự sắp xếp công việc. Đây là sự chủ động trong công việc.\"], [\"Who appreciates the freedom to choose how to spend time?\", \"A\", 5, \"A explicitly values choosing how to spend free time and whom to spend it with. D focuses on organising work tasks.\", \"A nói rõ việc được chọn cách sử dụng thời gian rảnh và ở bên ai. D tập trung vào cách sắp xếp nhiệm vụ công việc.\"], [\"Who thinks it’s hard to solve doubts when working from home?\", \"B\", 2, \"“Need clarification” and difficulty getting feedback match “solve doubts”: getting questions answered so the task can continue.\", \"“Need clarification” và khó nhận phản hồi tương ứng với “solve doubts”: cần được giải đáp để tiếp tục công việc.\"]], LETTERS=['A','B','C','D'];\nconst KEY='pop-dossier-matching-part3-v1';let state={answers:Array(7).fill(''),checked:false,bilingual:false,skim:false};\ntry{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.answers)&&s.answers.length===7)state={answers:s.answers.map(a=>LETTERS.includes(a)?a:''),checked:!!s.checked,bilingual:!!s.bilingual,skim:!!s.skim}}catch(e){}\nconst el=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}\nfunction grade(answers){return answers.reduce((n,a,i)=>n+(a===QUESTIONS[i][1]),0)}\nfunction showEvidence(i){document.querySelectorAll('.evidence').forEach(e=>e.classList.remove('evidence'));const q=QUESTIONS[i],target=el('sentence-'+q[1]+'-'+q[2]);target.classList.add('evidence');target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});}\nfunction render(){document.body.classList.toggle('bilingual',state.bilingual);el('language').textContent=state.bilingual?'EN + VI':'EN / VI';el('language').setAttribute('aria-pressed',state.bilingual);el('skim').setAttribute('aria-pressed',state.skim);el('skim').textContent=state.skim?'Skim: on':'Skim';el('reading').classList.toggle('skim',state.skim);\nel('reading').innerHTML=TEXTS.map((ss,i)=>'<article class=\"person\" id=\"person-'+LETTERS[i]+'\"><h3><b>'+LETTERS[i]+'<\/b>PERSON '+LETTERS[i]+'<\/h3><p>'+ss.map((s,j)=>'<span id=\"sentence-'+LETTERS[i]+'-'+j+'\" class=\"'+(j===0||j===ss.length-1?'edge':'')+'\">'+s+'<\/span>').join(' ')+'<\/p><\/article>').join('');\nel('questions').innerHTML=QUESTIONS.map((q,i)=>'<section class=\"qcard\"><h3 id=\"question-'+i+'\">'+(i+1)+'. '+q[0]+'<\/h3><div class=\"choices\" role=\"group\" aria-labelledby=\"question-'+i+'\">'+LETTERS.map(a=>'<button data-q=\"'+i+'\" data-a=\"'+a+'\" aria-pressed=\"'+(state.answers[i]===a)+'\" class=\"'+(state.answers[i]===a?'selected ':'')+(state.checked&&a===q[1]?'correctchoice':'')+'\">'+a+'<\/button>').join('')+'<\/div>'+(state.checked?'<div class=\"feedback\"><strong>'+(state.answers[i]===q[1]?'✓ Correct':'✗ Your answer: '+state.answers[i]+' · Correct: '+q[1])+'<\/strong><blockquote>“'+TEXTS[LETTERS.indexOf(q[1])][q[2]]+'”<\/blockquote>'+q[3]+'<span class=\"vi\">'+q[4]+'<\/span><p style=\"margin:10px 0 0\"><button data-evidence=\"'+i+'\">Find evidence in text<\/button><\/p><\/div>':'')+'<\/section>').join('');\nel('questions').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q;state.answers[i]=b.dataset.a;save();render();const focus=el('questions').querySelector('[data-q=\"'+i+'\"][data-a=\"'+state.answers[i]+'\"]');focus.focus({preventScroll:true})});el('questions').querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>showEvidence(+b.dataset.evidence));\nconst n=grade(state.answers),answered=state.answers.filter(Boolean).length;el('score').textContent=state.checked?n+' / 7 correct':answered+' / 7 answered';el('badge').textContent=state.checked&&n===7?'COMPLETE!':'MATCH THE IDEAS';el('message').textContent=state.checked?(n===7?'Well done! All seven matches are correct.':'Compare your choices with the evidence. You can change any answer.'):'Choose a person for each question.';}\nel('check').onclick=()=>{if(state.answers.some(a=>!a)){el('message').textContent='Answer all 7 questions before checking.';el('questions').querySelector('[data-q=\"'+state.answers.findIndex(a=>!a)+'\"]').focus();return}state.checked=true;save();render()};el('reset').onclick=()=>{state.answers=Array(7).fill('');state.checked=false;save();render()};el('language').onclick=()=>{state.bilingual=!state.bilingual;save();render()};el('skim').onclick=()=>{state.skim=!state.skim;save();render()};el('jump').onclick=()=>el('questions').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});render();\nconst scanMatch=()=>{document.querySelectorAll('#reading .person p span').forEach(e=>{const original=e.textContent,q=el('scanMatch').value.trim().toLowerCase();e.textContent='';let pos=0,i;while(q&&(i=original.toLowerCase().indexOf(q,pos))!==-1){e.append(document.createTextNode(original.slice(pos,i)));const mark=document.createElement('mark');mark.textContent=original.slice(i,i+q.length);e.append(mark);pos=i+q.length}e.append(document.createTextNode(original.slice(pos)))})};el('scanMatch').oninput=scanMatch;el('clearMatch').onclick=()=>{el('scanMatch').value='';scanMatch()};<\/script><script>new ResizeObserver(()=>parent.postMessage({popHeight:document.documentElement.scrollHeight},'*')).observe(document.body);<\/script><\/body><\/html>"};const frame=document.getElementById('lesson');function openLesson(k){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.id===k));frame.srcdoc=LESSONS[k];}document.getElementById('long').onclick=()=>openLesson('long');document.getElementById('match').onclick=()=>openLesson('match');addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data&&Number.isFinite(e.data.popHeight))frame.style.height=(e.data.popHeight+20)+'px'});openLesson('long');</script></body></html>
